<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>3年技術 テスト勉強</title>
<style>
:root{
  --bg:#f6f3ec; --card:#fff; --ink:#1f2633; --sub:#5a6272; --line:#ddd6c7;
  --fab:#c8641e; --mbit:#2f6fb5; --deai:#178a7e; --hikari:#96700a; --ai:#7a3fb0; --mix:#374151;
  --ok:#1e8a4c; --ng:#c0392b; --hl:#fff2b8;
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font-family:"BIZ UDPGothic","BIZ UDGothic","Hiragino Sans","Yu Gothic",sans-serif;line-height:1.6;-webkit-text-size-adjust:100%}
button{font:inherit;cursor:pointer}
header{background:#1f2633;color:#fff;padding:10px 16px;display:flex;align-items:center;gap:10px;position:sticky;top:0;z-index:5}
header h1{font-size:18px;margin:0;flex:1}
header button{background:#ffffff22;color:#fff;border:1px solid #ffffff55;border-radius:8px;padding:4px 12px}
main{max-width:760px;margin:0 auto;padding:16px}
.hidden{display:none!important}
h2{font-size:20px;margin:6px 0 12px}
.lead{color:var(--sub);font-size:14px;margin:0 0 14px}
/* home */
.unit{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;border-left:8px solid var(--c);box-shadow:0 1px 3px #0001}
.unit .t{font-weight:bold;font-size:18px}
.unit .s{color:var(--sub);font-size:13px}
.unit .bar{height:6px;background:#eee;border-radius:3px;margin:8px 0 10px;overflow:hidden}
.unit .bar i{display:block;height:100%;background:var(--c)}
.unit .stat{font-size:12px;color:var(--sub)}
.btns{display:flex;gap:8px;flex-wrap:wrap}
.btn{border:2px solid var(--c,#555);background:#fff;color:var(--c,#555);border-radius:10px;padding:8px 14px;font-weight:bold;min-width:84px}
.btn.fill{background:var(--c,#555);color:#fff}
.btn:disabled{opacity:.4;cursor:default}
.opts{display:flex;gap:8px;align-items:center;flex-wrap:wrap;font-size:14px;margin:4px 0 14px;color:var(--sub)}
.opts select{font:inherit;padding:4px 8px;border-radius:8px;border:1px solid var(--line)}
/* quiz */
.qhead{display:flex;justify-content:space-between;font-size:13px;color:var(--sub)}
.prog{height:8px;background:#e6e0d3;border-radius:4px;overflow:hidden;margin:4px 0 14px}
.prog i{display:block;height:100%;background:var(--c);transition:width .3s}
.qcard{background:var(--card);border-radius:14px;padding:16px;box-shadow:0 1px 3px #0001}
.tag{display:inline-block;font-size:12px;background:var(--c);color:#fff;border-radius:20px;padding:1px 10px;margin-bottom:6px}
.qtext{font-size:18px;font-weight:bold;margin:0 0 12px}
.fig{text-align:center;margin:4px 0 12px}
.fig svg{max-width:100%;height:auto}
.choices{display:grid;gap:8px}
.choice{text-align:left;background:#fff;border:2px solid var(--line);border-radius:10px;padding:10px 12px;font-size:16px;display:flex;gap:10px;align-items:flex-start}
.choice .n{flex:none;width:24px;height:24px;border-radius:50%;background:#eee;font-size:13px;display:flex;align-items:center;justify-content:center;margin-top:1px}
.choice:hover:not(:disabled){border-color:var(--c)}
.choice.ok{border-color:var(--ok);background:#e8f6ee}
.choice.ng{border-color:var(--ng);background:#fbeaea}
.choice:disabled{cursor:default;color:inherit}
.fb{margin-top:12px;border-radius:10px;padding:10px 12px;font-size:15px}
.fb.ok{background:#e8f6ee;border:1px solid #b7dfc7}
.fb.ng{background:#fbeaea;border:1px solid #efc2bd}
.fb b{font-size:17px}
.next{margin-top:12px;width:100%;padding:12px;font-size:17px}
.play{background:var(--c);color:#fff;border:none;border-radius:30px;padding:8px 18px;font-weight:bold;margin-bottom:12px}
/* order */
.picked{min-height:46px;border:2px dashed var(--line);border-radius:10px;padding:6px;display:flex;flex-wrap:wrap;gap:6px;margin-bottom:10px;align-items:center}
.picked:empty::before{content:"下のボタンを順番にタップ";color:#aaa;font-size:14px;padding-left:4px}
.chip{border:2px solid var(--c);background:#fff;color:var(--ink);border-radius:20px;padding:5px 12px;font-size:15px}
.chip.in{background:var(--c);color:#fff}
.chip.ok{background:var(--ok);border-color:var(--ok);color:#fff}
.chip.ng{background:var(--ng);border-color:var(--ng);color:#fff}
.chip:disabled{cursor:default}
.pool{display:flex;flex-wrap:wrap;gap:6px}
/* result */
.score{font-size:46px;font-weight:bold;text-align:center;color:var(--c);margin:6px 0 0}
.msg{text-align:center;margin:0 0 14px}
.miss{background:#fff;border-radius:10px;padding:10px 12px;margin-bottom:8px;border-left:5px solid var(--ng);font-size:14px}
.miss .a{color:var(--ok);font-weight:bold}
/* cards */
.flash{background:var(--card);border-radius:16px;min-height:230px;padding:22px 18px;box-shadow:0 2px 6px #0002;display:flex;flex-direction:column;justify-content:center;align-items:center;text-align:center;cursor:pointer;user-select:none;border-top:8px solid var(--c)}
.flash .front{font-size:19px;font-weight:bold}
.flash .back{font-size:22px;font-weight:bold;color:var(--c)}
.flash .ex{font-size:14px;color:var(--sub);margin-top:10px}
.flash .hint{font-size:12px;color:#999;margin-top:14px}
.cardnav{display:flex;gap:8px;margin-top:12px}
.cardnav .btn{flex:1;padding:12px}
/* summary */
.sum{background:var(--card);border-radius:14px;padding:14px 16px;margin-bottom:12px;box-shadow:0 1px 3px #0001}
.sum h3{margin:0 0 8px;font-size:17px;color:var(--c);border-bottom:2px solid var(--c);padding-bottom:3px}
.sum p,.sum li{font-size:15px}
.sum ul{padding-left:20px;margin:6px 0}
.k{background:linear-gradient(transparent 55%,var(--hl) 55%);font-weight:bold}
table.t{border-collapse:collapse;width:100%;font-size:14px;margin:6px 0}
table.t th,table.t td{border:1px solid var(--line);padding:5px 6px;text-align:center;vertical-align:middle}
table.t th{background:#f3efe5}
.flow{display:flex;flex-direction:column;gap:4px;margin:6px 0}
.flow div{background:#f3efe5;border-radius:8px;padding:6px 10px;font-size:14px;position:relative}
.flow div b{color:var(--c)}
.mini{font-size:13px;color:var(--sub)}
.keys{display:grid;grid-template-columns:repeat(auto-fill,minmax(160px,1fr));gap:8px}
.keys .kk{border:1px solid var(--line);border-radius:10px;padding:4px;text-align:center;font-size:13px}
.chordbtns{display:flex;flex-wrap:wrap;gap:6px;margin:6px 0}
.chordbtns button{border:1px solid var(--c);background:#fff;color:var(--c);border-radius:8px;padding:4px 10px;font-size:14px}
.tip{background:#fffbea;border:1px solid #efe1a4;border-radius:10px;padding:8px 12px;font-size:14px;margin-top:8px}
footer{text-align:center;font-size:12px;color:#999;padding:20px}
@media (max-width:480px){.qtext{font-size:17px}.choice{font-size:15px}}

/* ---- 技術版の追加 ---- */
.point{background:var(--c);color:#fff;border-radius:14px;padding:12px 16px;margin-bottom:12px}
.point h3{margin:0 0 4px;font-size:16px}
.point ul{margin:0;padding-left:20px}
.point li{font-size:15px}
.sum{scroll-margin-top:60px}
.sum.hit{outline:3px solid var(--c)}
.row3{display:flex;align-items:stretch;gap:4px;margin:8px 0}
.row3>div{flex:1;min-width:0;background:#f3efe5;border-radius:10px;padding:8px 4px;text-align:center;font-size:13px;border-top:4px solid var(--c)}
.row3>div b{display:block;font-size:15px;color:var(--c)}
.row3>i{flex:none;align-self:center;font-style:normal;color:var(--c);font-size:12px}
.flow.arrow div:not(:last-child){margin-bottom:14px}
.flow.arrow div:not(:last-child)::after{content:"▼";position:absolute;left:50%;bottom:-18px;transform:translateX(-50%);color:var(--c);font-size:11px}
.flow.steps div:nth-child(2){margin-left:8%}
.flow.steps div:nth-child(3){margin-left:16%}
.sw{display:inline-block;width:28px;height:10px;border-radius:5px;border:1px solid #888;vertical-align:middle;margin-right:6px}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:6px;margin:6px 0}
.grid2 div{background:#f3efe5;border-radius:8px;padding:6px 8px;font-size:14px}
table.t td.l{text-align:left}
table.t.nw td:first-child{white-space:nowrap}
rt{font-size:9px;font-weight:normal}
.hide .k{color:transparent;background:var(--hl);border-radius:4px;cursor:pointer;user-select:none}
.hide .k.show{color:inherit;background:linear-gradient(transparent 55%,var(--hl) 55%)}
.lk{border:none;background:none;color:#2f6fb5;text-decoration:underline;padding:0;font-size:13px}
#hideNote{font-size:13px;color:var(--sub);align-self:center}
</style>
</head>
<body>
<header>
  <h1>🔧 3年 技術 テスト勉強</h1>
  <button id="homeBtn" class="hidden" onclick="go('home')">ホーム</button>
</header>
<main id="app"></main>
<footer>成績はこの端末のブラウザだけに保存されます</footer>

<script>
'use strict';
/* ===================== 単元 ===================== */
const UNITS = {
  fab:{name:'デジタルファブリケーション入門',sub:'データが、モノになる ── 3Dプリンタのしくみと設計',c:'var(--fab)',icon:'🖨️'},
  mbit:{name:'micro:bitで計測・制御にチャレンジ',sub:'センサ・コンピュータ・アクチュエータと micro:bit の入力・出力',c:'var(--mbit)',icon:'🎛️'},
  deai:{name:'micro:bitとの出会い',sub:'拡張ボード＋Groveケーブルで 振動モータと3色LED',c:'var(--deai)',icon:'💡'},
  hikari:{name:'明るさで動かそう',sub:'光センサ＋しきい値＋「もし〜なら」で 振動モータを自動でON/OFF',c:'var(--hikari)',icon:'🔆'},
  ai:{name:'AIに、何を任せる？',sub:'AIの歴史・しくみ・得意と苦手・頼み方・これから',c:'var(--ai)',icon:'🤖'}
};
function staffSVG(){return '';}

/* ===================== 問題のタグ → まとめの何番か ===================== */
const SEC = {
  fab:{'用語':1,'加工法':2,'社会':3,'しくみ':4,'データの旅':5,'実機':6,'設計':6},
  mbit:{'計測・制御':1,'身近な例':2,'micro:bit':3,'入力':3,'出力':3,'プログラム':4,'サイコロ':5,'お約束':6},
  deai:{'しくみ':1,'拡張ボード':2,'Grove':2,'実習①':3,'振動モータ':3,'3色LED':4,'色づくり':5,'光の三原色':5,'安全':6},
  hikari:{'自動':1,'光センサ':2,'値':3,'しきい値':4,'フローチャート':5,'プログラム':6,'こまったら':7},
  ai:{'AIの歴史':1,'しくみ':2,'得意と苦手':3,'頼み方':4,'できる範囲':5,'任せる？':6,'これから':7}
};
const MARU='①②③④⑤⑥⑦⑧⑨';
function secOf(q){return q.s||(SEC[q.u]||{})[q.tag]||0;}
function secHint(q){const n=secOf(q);return n?`<br><span class="mini">📘 「まとめ」の${MARU[n-1]}にのっています</span>`:'';}
function secLink(q){const n=secOf(q);return n?`<br><button class="lk" onclick="jump('${q.u}',${n})">📘 まとめ${MARU[n-1]}で確認する</button>`:'';}
function jump(u,n){
  go('sum',u);
  const el=document.querySelectorAll('.sum')[n-1];
  if(el){el.classList.add('hit');el.scrollIntoView({block:'start'});}
}
/* まとめ：マーカーをかくす */
function toggleHide(){
  const b=document.querySelector('#sumbody'),on=b.classList.toggle('hide');
  b.querySelectorAll('.k.show').forEach(x=>x.classList.remove('show'));
  document.querySelector('#hideBtn').textContent=on?'👀 ぜんぶ見せる':'🙈 マーカーをかくして確認';
  document.querySelector('#hideNote').textContent=on?'かくれた所を、答えを思いうかべてからタップしよう':'';
}
document.addEventListener('click',e=>{const k=e.target.closest&&e.target.closest('.hide .k');if(k)k.classList.toggle('show');});

/* ===================== 問題 ===================== */
const Q = [
/* ---------- デジタルファブリケーション ---------- */
{id:'f01',u:'fab',tag:'用語',q:'「デジタルデータをもとに、機械でモノを作る技術」を何という？',a:'デジタルファブリケーション',d:['大量生産','手作業による加工','プログラミング'],e:'デジタル（データ）＋ファブリケーション（ものづくり）。合言葉は「データが、モノになる」。'},
{id:'f02',u:'fab',tag:'用語',q:'デジタルファブリケーションのキーワード「データがあれば、誰でも・どこでも・（　）が作れる」の（　）は？',a:'同じもの',d:['安いもの','大きいもの','速いもの'],e:'腕前ではなくデータどおりに機械が動くので、だれが・どこで作っても同じものになる。'},
{id:'f03',u:'fab',tag:'用語',q:'デジタルファブリケーションに使う機械として、授業で紹介されなかったものは？',a:'のこぎり',d:['3Dプリンタ','レーザー加工機','切削加工機（CNC）'],e:'3つの機械はどれも「データから作る」。のこぎりはデータではなく、人の腕前で使う道具。'},
{id:'f04',u:'fab',tag:'加工法',q:'のこぎりで切る・かんなで削るなど、材料から不要な部分を取り除く加工は？',a:'引き算の加工（除去加工）',d:['足し算の加工（付加加工）','かけ算の加工','わり算の加工'],e:'取り除く＝材料が減る＝引き算。「除去」は取り除くという意味。切りくず（無駄）が出る。'},
{id:'f05',u:'fab',tag:'加工法',q:'3Dプリンタのように、材料を少しずつ積み上げる加工は？',a:'足し算の加工（付加加工）',d:['引き算の加工（除去加工）','曲げ加工','鋳造'],e:'積み上げる＝材料が増える＝足し算。「付加」は付け加えるという意味。必要な分だけ使うので切りくずが出ない。'},
{id:'f06',u:'fab',tag:'加工法',q:'引き算の加工で必ず出て、足し算の加工では出ないものは？',a:'切りくず（無駄）',d:['設計データ','熱','におい'],e:'引き算はかたまりから取り除くので、取り除いた分が切りくずになる。足し算は必要な分だけ積むので出ない。'},
{id:'f07',u:'fab',tag:'加工法',q:'足し算の加工だからこそ作れるものは？',a:'中が空洞の形や、組み立てなしで動く部品',d:['大きな木の板','まっすぐな角材','同じ形の大量生産品を安く'],e:'引き算は外から刃を当てるので、中までは削れない。足し算は下から1層ずつ積むので、中の形も自由に作れる。'},
{id:'f08',u:'fab',tag:'社会',q:'医療でのデジタルファブリケーションの例は？',a:'患者に合わせた義手や手術の練習モデル',d:['宇宙ステーションで部品を印刷','開発の試作品','ドローンのプロペラの修理'],e:'体の形は一人ひとり違う。データを変えるだけで「その人専用」が作れるのが強み。'},
{id:'f09',u:'fab',tag:'社会',q:'宇宙ステーションで工具が壊れたとき、デジタルファブリケーションならどうする？',a:'データだけ送って、その場で印刷する',d:['地球から数か月かけて送る','宇宙飛行士が手作業で削る','あきらめて帰還する'],e:'モノを運ぶのは大変でも、データならネットで一瞬。「どこでも作れる」の例。'},
{id:'f10',u:'fab',tag:'社会',q:'試作品づくりにデジタルファブリケーションを使うと、開発期間はどうなった？',a:'数か月から数日に短縮',d:['数日から数か月にのびた','変わらない','数年かかるようになった'],e:'データを直してすぐ作り直せるから速い。だから新商品が出るペースも速くなった。'},
{id:'f11',u:'fab',tag:'社会',q:'大量生産とくらべた、デジタルファブリケーションの得意なことは？',a:'一人ひとり違うものを、少しずつ作る',d:['同じものを安くたくさん作る','材料を使わずに作る','人がいなくても設計する'],e:'大量生産＝同じものを安くたくさん。デジファブ＝データを変えれば1個ずつ違うものが作れる。'},
{id:'f12',u:'fab',tag:'しくみ',q:'授業で使った3Dプリンタの方式「FDM方式」を漢字で何という？',a:'熱溶解積層方式',d:['光造形方式','粉末焼結方式','切削方式'],e:'漢字のとおり「熱で・溶解（とか）して・積層（つみ重ね）する」方式。'},
{id:'f13',u:'fab',tag:'しくみ',q:'FDM方式の3Dプリンタをたとえると？',a:'グルーガンを、ロボットが超正確に動かしている',d:['のこぎりをロボットが動かしている','インクジェットで紙に印刷している','粘土を手でこねている'],e:'グルーガンも3Dプリンタも、材料を熱で溶かして細く出し、冷えると固まる。'},
{id:'f14',u:'fab',tag:'しくみ',q:'3Dプリンタで使う、細い糸のような材料を何という？',a:'フィラメント',d:['インク','トナー','ワイヤー'],e:'フィラメント＝材料。これを約200℃で溶かして積み上げる。'},
{id:'f15',u:'fab',tag:'しくみ',q:'フィラメントを溶かす温度は約何℃？',a:'約200℃',d:['約50℃','約100℃','約1000℃'],e:'お湯（100℃）では溶けない。覚える数字は2つ：約200℃ と 1層0.2mm。'},
{id:'f16',u:'fab',tag:'しくみ',q:'授業の3Dプリンタで、1層の厚さは？',a:'0.2mm',d:['2mm','0.02mm','2cm'],e:'コピー用紙2枚分くらいのうすさ。これを何百回も重ねて形にする。'},
{id:'f17',u:'fab',tag:'しくみ',q:'1層0.2mmで、高さ40mmのキーホルダーを作ると何層になる？',a:'200層',d:['20層','80層','400層'],e:'高さ ÷ 1層の厚さ ＝ 40 ÷ 0.2 ＝ 200層。層が多いから3Dプリンタは時間がかかる。'},
{id:'f18',u:'fab',tag:'データの旅',type:'order',q:'3Dプリンタでモノができるまでの「データの旅」を順に並べよう',items:['設計データを作る','スライサーで輪切りにする','機械への命令（G-code）に変換','機械が積み上げて形にする'],e:'形を作る → 輪切りにする → 命令にする → 機械が動く、の順。'},
{id:'f19',u:'fab',tag:'データの旅',q:'立体の設計データを、薄く「輪切り」にするソフトを何という？',a:'スライサー',d:['ブラウザ','MakeCode','ワープロ'],e:'スライス（うすく切る）するソフトだからスライサー。3Dプリンタは1層ずつしか作れないので、先に輪切りにしておく。'},
{id:'f20',u:'fab',tag:'データの旅',q:'「どこへ、どの速さで、どれだけ材料を出しながら動くか」を表す、3Dプリンタへの命令を何という？',a:'G-code',d:['HTML','フィラメント','スライサー'],e:'スライサー＝輪切りにする「ソフト」、G-code＝できあがった「命令」。画面の「G1 X100 Y100 …」がそれ。'},
{id:'f21',u:'fab',tag:'データの旅',q:'設計データを何に変えることで、機械はモノを作れる？',a:'輪切りの命令書',d:['写真','設計図の印刷','音声'],e:'「輪切り」＝スライサーの仕事、「命令書」＝G-code。2つを合わせた言い方。'},

function pickOne(a){return a[Math.floor(Math.random()*a.length)];}

function unitColor(u){return u==='mix'||u==='weak'?'var(--mix)':UNITS[u].c;}
function build(q){ // 生成問題を実体化

  const q=build(C.list[C.i]);
  $('#app').innerHTML=`<div style="--c:${U.c}">
  <div class="qhead"><span>${U.icon} ${U.name}　カード</span><span>${C.i+1} / ${C.list.length}</span></div>
  <div class="prog"><i style="width:${C.i/C.list.length*100}%"></i></div>
  <div class="flash" onclick="C.flip=!C.flip;drawCardFace()">
    <div class="tag">${esc(q.tag)}</div>
    ${q.fig?`<div class="fig">${staffSVG(q.fig)}</div>`:''}
    <div class="front">${esc(q.q)}</div>
    <div id="cb"></div>
    <div class="hint" id="ch">タップで答えを見る（スペースキーでもOK）</div>
  </div>
  ${q.audio?`<div style="text-align:center;margin-top:10px"><button class="play" onclick="playQ()">▶ 音を聴く</button></div>`:''}
  <div class="cardnav"><button class="btn" style="--c:var(--ng)" onclick="cardNext(false)">✕ まだ</button><button class="btn fill" style="--c:var(--ok)" onclick="cardNext(true)">○ 覚えた</button></div></div>`;
  C.q=q; C.flip=false;
}
function drawCardFace(){
  $('#cb').innerHTML=C.flip?`<div class="back">${esc(C.q.a)}</div><div class="ex">${esc(C.q.e||'')}</div>`:'';
  $('#ch').textContent=C.flip?'○か✕を選んで次へ':'タップで答えを見る（スペースキーでもOK）';
}
function cardNext(ok){record(C.list[C.i].id,ok);C.i++;drawCard();}

/* ---------- クイズ ---------- */
function startQuiz(u,list){
  let pool=list|| (u==='mix'?Q.slice(): u==='weak'?Q.filter(q=>isWeak(q.id)):Q.filter(q=>q.u===u));
  pool=shuffle(pool);
  if(!list && u!=='weak' && ST.n) pool=pool.slice(0,ST.n);
  S={u,list:pool,i:0,ok:0,miss:[]};
  drawQ();
}
function drawQ(){
  if(S.i>=S.list.length) return result();
  const raw=S.list[S.i],q=build(raw),uc=unitColor(raw.u);
  S.cur=q; S.answered=false;
  const title=S.u==='mix'?'全範囲ミックス':S.u==='weak'?'まちがえた問題':UNITS[S.u].name;
  let body='';
  if(q.type==='order'){
    S.picked=[]; S.pool=shuffle(q.items);
    body=`<div class="picked" id="picked"></div><div class="pool" id="pool"></div>
    <div class="btns" style="margin-top:10px"><button class="btn" onclick="S.picked=[];drawOrder()">やり直す</button><button class="btn fill" id="chk" onclick="checkOrder()" disabled>答え合わせ</button></div>`;
  }else{
    S.opts=shuffle([q.a,...q.d]);
    body=`<div class="choices">${S.opts.map((o,i)=>`<button class="choice" data-i="${i}" onclick="answer(${i})"><span class="n">${i+1}</span><span>${esc(o)}</span></button>`).join('')}</div>`;
  }
  $('#app').innerHTML=`<div style="--c:${uc}">
  <div class="qhead"><span>${esc(title)}</span><span>${S.i+1} / ${S.list.length}　正解 ${S.ok}</span></div>
  <div class="prog"><i style="width:${S.i/S.list.length*100}%"></i></div>
  <div class="qcard" style="--c:${UNITS[raw.u].c}">
    <div class="tag">${UNITS[raw.u].icon} ${esc(q.tag)}</div>
    <p class="qtext">${esc(q.q)}</p>
    ${q.fig?`<div class="fig">${staffSVG(q.fig)}</div>`:''}
    ${q.audio?`<button class="play" onclick="playQ()">▶ 音を聴く</button>`:''}
    ${body}
    <div id="fb"></div>
  </div></div>`;
  if(q.type==='order') drawOrder();
  if(q.listen) setTimeout(()=>{try{playQ();}catch(e){}},300);
}
function playQ(){
  const q=S&&S.cur&&$('.qcard')?S.cur:C&&C.q;
  if(!q||!q.audio) return;
  if(q.audio.chord) playChord(CH[q.audio.chord]);
  if(q.audio.meter) playMeter(q.audio.meter);
}
function answer(i){
  if(S.answered) return; S.answered=true;
  const q=S.cur,ok=S.opts[i]===q.a;
  document.querySelectorAll('.choice').forEach((b,j)=>{b.disabled=true;if(S.opts[j]===q.a)b.classList.add('ok');else if(j===i)b.classList.add('ng');});
  finish(ok,q.a);
}
function drawOrder(){
  const rest=S.pool.filter(x=>!S.picked.includes(x));
  $('#picked').innerHTML=S.picked.map((x,i)=>`<button class="chip in" onclick="S.picked.splice(${i},1);drawOrder()">${i+1}. ${esc(x)}</button>`).join('');
  $('#pool').innerHTML=rest.map(x=>`<button class="chip" onclick='S.picked.push(${JSON.stringify(x)});drawOrder()'>${esc(x)}</button>`).join('');
  $('#chk').disabled=S.picked.length!==S.pool.length;
}
function checkOrder(){
  if(S.answered) return; S.answered=true;
  const q=S.cur,ok=S.picked.every((x,i)=>x===q.items[i]);
  $('#picked').innerHTML=S.picked.map((x,i)=>`<button class="chip ${x===q.items[i]?'ok':'ng'}" disabled>${i+1}. ${esc(x)}</button>`).join('');
  document.querySelectorAll('.btns .btn').forEach(b=>b.disabled=true);
  finish(ok,q.items.join(' → '));
}
function finish(ok,ans){
  const q=S.cur;
  record(q.id,ok);
  if(ok) S.ok++; else S.miss.push({q:q.q,a:ans,e:q.e,raw:S.list[S.i]});
  $('#fb').innerHTML=`<div class="fb ${ok?'ok':'ng'}"><b>${ok?'⭕ 正解！':'❌ ざんねん'}</b>${ok?'':`<br>正解：<b>${esc(ans)}</b>`}${q.e?`<br>${esc(q.e)}`:''}${ok?'':secHint(S.list[S.i])}</div>
  <button class="btn fill next" id="nextBtn" onclick="S.i++;drawQ()">${S.i+1<S.list.length?'次の問題へ ▶':'結果を見る ▶'}</button>`;
  $('#nextBtn').focus({preventScroll:true});
  $('#fb').scrollIntoView({behavior:'smooth',block:'nearest'});
}
function result(){
  const n=S.list.length,p=Math.round(S.ok/n*100),uc=unitColor(S.u);
  const msg=p===100?'パーフェクト！ テストもこの調子 🎉':p>=80?'よくできました！ あと少しで満点 👍':p>=50?'いい感じ。まちがえた所を「まとめ」で確認しよう':'まずは「まとめ」と「カード」で覚えてから再挑戦しよう';
  $('#app').innerHTML=`<div style="--c:${uc}"><h2>結果</h2>
  <p class="score">${S.ok} / ${n}</p><p class="msg">${p}点　${msg}</p>
  <div class="btns" style="margin-bottom:14px">${S.miss.length?`<button class="btn fill" onclick="startQuiz('${S.u}',S.miss.map(m=>m.raw))">まちがえた${S.miss.length}問をもう一度</button>`:''}
  <button class="btn" onclick="go('quiz','${S.u}')">別の問題で</button><button class="btn" onclick="go('home')">ホーム</button></div>
  ${S.miss.map(m=>`<div class="miss">${esc(m.q)}<br><span class="a">→ ${esc(m.a)}</span>${m.e?`<br><span class="mini">${esc(m.e)}</span>`:''}${secLink(m.raw)}</div>`).join('')}</div>`;
}

/* キーボード：1〜4で選ぶ、Enterで次へ、スペースでカードをめくる */
document.addEventListener('keydown',e=>{
  if(e.target.tagName==='SELECT') return;
  if($('.choices')&&!S.answered&&/^[1-4]$/.test(e.key)){const b=document.querySelector(`.choice[data-i="${+e.key-1}"]`);if(b){b.click();e.preventDefault();}}
  else if(e.key==='Enter'&&$('#nextBtn')){e.preventDefault();$('#nextBtn').click();}
  else if(e.key===' '&&$('.flash')){e.preventDefault();C.flip=!C.flip;drawCardFace();}
});

go('home');
</script>
</body>
</html>
